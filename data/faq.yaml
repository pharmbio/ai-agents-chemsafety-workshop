# Questions and answers. Answers accept Markdown (links, **bold**, lists).
items:
  - q: "Does it cost anything?"
    a: "No. Attendance is free of charge. Lunch and coffee are provided for on-site participants who register."
  - q: "Do I need programming experience?"
    a: "No. The talks and the demo are aimed at a mixed audience of researchers, risk assessors and students."
  - q: "How do I join online?"
    a: "Register and choose **Online via Zoom**. The Zoom link is emailed to registered online participants the day before the workshop."
  - q: "Can online participants ask questions?"
    a: "Yes. Talks and the panel are streamed, and you can post questions in the Zoom chat. You can also send a question in advance in the Discussion section of this page."
  - q: "Will the sessions be recorded?"
    a: "This will be announced before the workshop. Links to slides and recordings will be added to the programme if they are made available."
  - q: "I registered but can no longer come. What should I do?"
    a: "Please email the organisers so that lunch can be planned for the right number of people."
